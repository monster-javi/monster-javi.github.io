<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps · MonsterJavi</title>
<meta name="theme-color" content="#0c0e11">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="alternate icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c0e11;--surface:#14171b;--surface-2:#191d22;--border:#262b32;--text:#e9ebee;--dim:#8d94a0;--faint:#5f6772;
        --blue:#5b97ff;--amber:#f2ab43;--green:#3ecf6a;--red:#ff6a4d;--shadow:0 20px 50px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}
  @media (prefers-color-scheme: light){:root{--bg:#f4f5f7;--surface:#ffffff;--surface-2:#ffffff;--border:#e3e6ea;--text:#16191d;--dim:#5d6470;--faint:#9aa1ab;
        --blue:#2f6fe0;--amber:#d48a17;--green:#1e9e50;--red:#e4472d;--shadow:0 12px 32px -14px rgba(20,25,35,.25),0 0 0 1px rgba(20,25,35,.06)}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:880px;margin:0 auto;padding:56px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(91,151,255,.18)}
  .lang{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:2px}
  .lang button{border:0;background:none;color:var(--dim);font:inherit;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer}
  .lang button.on{background:var(--surface-2);color:var(--text);box-shadow:0 0 0 1px var(--border)}
  h1{font-size:26px;line-height:1.25;letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 28px;font-size:14.5px}
  .notice{display:none;background:rgba(62,207,106,.1);color:var(--green);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:0 0 20px}
  .notice.show{display:block}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  a.app{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;background:var(--surface-2);border-radius:16px;padding:20px;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease}
  a.app:hover{transform:translateY(-2px)}
  a.app:focus-visible{outline:2px solid var(--c);outline-offset:3px}
  .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
  .ic--img{background:none;overflow:hidden}
  .ic--img img{width:100%;height:100%;display:block}
  .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .name{font-weight:700;font-size:16px}
  .desc{color:var(--dim);font-size:13.5px;line-height:1.5;flex:1}
  .go{display:flex;align-items:center;gap:6px;color:var(--c);font-weight:600;font-size:13.5px}
  .go svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
  a.app:hover .go svg{transform:translateX(3px)}
  .exp{margin-top:36px}
  .exp .list{display:grid;gap:8px}
  .exp h2{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
  a.mini{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--border);max-width:420px;transition:background .15s}
  a.mini:hover{background:var(--surface)}
  a.mini .ic{width:30px;height:30px;border-radius:9px}
  a.mini .ic svg{width:16px;height:16px}
  a.mini .t{font-weight:600;font-size:13.5px}
  a.mini .d{color:var(--dim);font-size:12.5px}
  a.mini .tag{margin-left:auto;font-size:11px;font-weight:600;color:var(--faint);border:1px solid var(--border);border-radius:6px;padding:2px 6px;white-space:nowrap}
  footer{margin-top:auto;padding-top:40px;color:var(--faint);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><span class="dot"></span><span>Apps</span></div>
    <div class="lang" role="group" aria-label="Idioma / Language"><button data-l="es">ESP</button><button data-l="en">ENG</button></div>
  </header>
  <div class="notice" id="notice" data-t="confirmed"></div>
  <h1 data-t="title"></h1>
  <p class="sub" data-t="sub"></p>
  <div class="grid">
    <a class="app" href="https://monster-javi.github.io/gastos-app/" style="--c:var(--blue)">
      <div class="ic ic--img"><img src="gastos-icon.svg" alt="" width="42" height="42"></div>
      <div class="name">Gastos App</div>
      <div class="desc" data-t="gastos"></div>
      <div class="go"><span data-t="open"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </a>
    <a class="app" href="https://monster-javi.github.io/task-app/" style="--c:var(--amber)">
      <div class="ic ic--img"><img src="https://monster-javi.github.io/task-app/task-icon.svg?v=71" alt="" width="42" height="42"></div>
      <div class="name">Task App</div>
      <div class="desc" data-t="task"></div>
      <div class="go"><span data-t="open"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </a>
  </div>
  <section class="exp">
    <h2 data-t="expTitle"></h2>
    <div class="list">
    <a class="mini" href="https://monster-javi.github.io/arbolito-app/" style="--c:var(--green)">
      <div class="ic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/></svg></div>
      <div><div class="t">Arbolito App</div><div class="d" data-t="arbolito"></div></div>
      <span class="tag" data-t="beta"></span>
    </a>
    <a class="mini" href="https://monster-javi.github.io/heladera-llena-app/" style="--c:var(--red)">
      <div class="ic ic--img"><img src="https://monster-javi.github.io/heladera-llena-app/icon.svg" alt="" width="30" height="30"></div>
      <div><div class="t">Heladera llena</div><div class="d" data-t="heladera"></div></div>
      <span class="tag" data-t="beta"></span>
    </a>
    </div>
  </section>
  <footer data-t="foot"></footer>
</main>
<script>
const T={
  es:{title:'Hola 👋',sub:'Elegí la app que querés abrir.',
      gastos:'Planilla anual de gastos, lista del mes, deudas, facturación y Bóveda cifrada.',
      task:'Tareas por área y proyecto, calendario, eventos y notas.',
      arbolito:'Árbol genealógico que se ordena solo.',heladera:'Compras del súper con promos de tu banco, conectada a Task App.',expTitle:'Experimentales',beta:'En prueba',
      open:'Abrir',confirmed:'¡Listo! Tu cuenta quedó confirmada. Elegí una app y entrá con tu mail y contraseña.',
      foot:'Tus datos se guardan en tu cuenta y, si activás el cifrado, solo vos podés leerlos.'},
  en:{title:'Hi 👋',sub:'Pick the app you want to open.',
      gastos:'Yearly expense sheet, monthly list, debts, invoicing and an encrypted Vault.',
      task:'Tasks by area and project, calendar, events and notes.',
      arbolito:'A family tree that lays itself out.',heladera:'Grocery planning with bank promos, linked to Task App.',expTitle:'Experimental',beta:'Beta',
      open:'Open',confirmed:'Done! Your account is confirmed. Pick an app and sign in with your email and password.',
      foot:'Your data is saved to your account and, if you turn on encryption, only you can read it.'}
};
let lang='es';
try{lang=localStorage.getItem('gt_lang')||localStorage.getItem('apps_lang')||(navigator.language||'es').slice(0,2);}catch(e){}
if(!T[lang])lang='es';
function apply(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{el.textContent=T[lang][el.dataset.t];});
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('apps_lang',lang);}catch(e){}apply();});
// coming back from a confirmation email
if(/type=(signup|email_change|magiclink)/.test(location.hash)||/access_token=/.test(location.hash)){
  document.getElementById('notice').classList.add('show');
  history.replaceState(null,'',location.pathname);
}
apply();
</script>
</body>
</html>
